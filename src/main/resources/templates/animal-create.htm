<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="/styles/styles.css" type="text/css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>
    <title>Create New Animal</title>
</head>
<body>
    <h1>Create New Animal</h1>
    <form method="POST" action="/animals/new">
        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name"><br><br>

        <label for="scientificName">Scientific Name:</label><br>
        <input type="text" id="scientificName" name="scientificName"><br><br>

        <label for="species">Species:</label><br>
        <input type="text" id="species" name="species"><br><br>

        <label for="habitat">Habitat:</label><br>
        <input type="text" id="habitat" name="habitat"><br><br>

        <label for="description">Description:</label><br>
        <textarea id="description" name="description"></textarea><br><br>

        <input type="submit" value="Create">
    </form>
</body>
</html>
